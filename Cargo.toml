[package]
name = "amaca"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
mlua = { version = "0.12.3", features = ["luajit", "send", "vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "macos")'.dependencies]
prost = "0.14"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
objc2-foundation = { version = "0.3", features = ["NSAppleEventDescriptor", "NSDate", "NSError", "NSString", "objc2-core-services"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console", "Win32_Foundation"] }
