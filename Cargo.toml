[package]
name = "amaca"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
jsonc-parser = { version = "0.34.0", features = ["serde"] }
libc = "0.2.191"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
prost = "0.14"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
objc2-foundation = { version = "0.3", features = ["NSAppleEventDescriptor", "NSDate", "NSError", "NSString", "objc2-core-services"] }

[dev-dependencies]
schemars = "1"
