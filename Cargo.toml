[package]
name = "amaca"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4.6.7", features = ["derive"] }
jsonc-parser = { version = "0.34.0", features = ["serde"] }
libc = "0.2.191"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
